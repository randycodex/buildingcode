version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/permitext-sync-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    versioning-strategy: "increase"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      excalidraw:
        patterns:
          - "@excalidraw/excalidraw"
      react:
        patterns:
          - "react"
          - "react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      server-runtime:
        patterns:
          - "@neondatabase/serverless"
          - "@vercel/blob"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
