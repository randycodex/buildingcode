<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>permitext workspace</title>
    <link rel="stylesheet" href="/web/styles.css?v=20260720-no-scrollbars-v17">
    <link rel="stylesheet" href="/web/workboard-assets/workboard.css?v=20260720-no-scrollbars-v17">
  </head>
  <body>
    <main class="workspace-shell">
      <header class="topbar">
        <div class="topbar-brand" aria-label="permitext workspace">
          <strong>permitext</strong>
          <span>Workspace</span>
        </div>
        <nav class="topbar-actions" aria-label="Workspace tools">
          <div class="topbar-action-group" aria-label="Read and find">
            <button class="toolbar-button" id="add-reader" type="button" aria-label="Add reader" title="Add reader">
              <span>Reader</span>
            </button>
            <button class="toolbar-button" id="toggle-search" type="button" aria-label="Search" title="Search" aria-pressed="false">Search</button>
          </div>
          <div class="topbar-action-group" aria-label="Your workspace">
            <button class="toolbar-button" id="toggle-saved" type="button" aria-label="Saved inbox" title="Saved inbox" aria-pressed="false">Saved</button>
            <button class="toolbar-button" id="toggle-projects" type="button" aria-label="Projects" title="Projects" aria-pressed="false">Projects</button>
          </div>
          <div class="topbar-action-group" aria-label="Research and preferences">
            <button class="toolbar-button" id="toggle-analysis" type="button" aria-label="AI-assisted research" title="AI-assisted research" aria-pressed="false">Research</button>
            <button class="toolbar-button" id="toggle-settings" type="button" aria-label="Settings" title="Settings" aria-pressed="false">Settings</button>
          </div>
        </nav>
        <div class="topbar-workspace-controls" aria-label="Workspace layout">
          <button class="toolbar-button" id="fit-columns" type="button" aria-label="Reset columns" title="Reset columns">Reset</button>
          <button class="toolbar-button" id="collapse-readers" type="button" aria-label="One reader" title="One reader">One Reader</button>
        </div>
      </header>

      <section class="panel-track" id="panel-track" aria-label="permitext web workspace"></section>
    </main>

    <template id="reader-template">
      <article class="workspace-panel reader-panel">
        <header class="panel-header">
          <div>
            <label class="reader-code-picker">
              <span class="sr-only">Code section</span>
              <select class="code-select"></select>
            </label>
            <h2 class="panel-title">Reader</h2>
          </div>
          <div class="panel-actions">
            <button class="ghost-button reader-comments-toggle" type="button" aria-pressed="false">Comments</button>
            <div class="reader-text-size-controls" role="group" aria-label="Reader text size">
              <button class="reader-text-size-button reader-text-decrease" type="button" aria-label="Decrease Reader text size">A−</button>
              <button class="reader-text-size-button reader-text-increase" type="button" aria-label="Increase Reader text size">A+</button>
            </div>
            <button class="icon-button reader-internal-search-toggle" type="button" title="Search in reader" aria-label="Search in reader" aria-pressed="false">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 6H3"></path>
                <path d="M10 12H3"></path>
                <path d="M10 18H3"></path>
                <circle cx="17" cy="15" r="3"></circle>
                <path d="m21 19-1.9-1.9"></path>
              </svg>
            </button>
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
            <button class="icon-button reader-close" type="button" title="Close reader" aria-label="Close reader">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m15 9-6 6"></path>
                <path d="m9 9 6 6"></path>
              </svg>
            </button>
          </div>
        </header>
        <div class="selector-stack">
          <label>
            Chapter
            <select class="chapter-select"></select>
          </label>
          <label class="section-picker" hidden>
            Section
            <select class="section-select"></select>
          </label>
        </div>
        <label class="reader-internal-search" hidden>
          <span class="sr-only">Search in reader</span>
          <input class="reader-internal-search-input" type="search" autocomplete="off" placeholder="Search this reader">
        </label>
        <section class="reader-body">
          <section class="reader-content"></section>
          <div class="reader-scroll-indicator" aria-hidden="true">
            <div class="reader-scroll-thumb"></div>
          </div>
          <div class="reader-comments-resizer" role="separator" aria-orientation="vertical" aria-label="Resize comments"></div>
          <aside class="reader-comments" hidden>
            <section class="comments-list">
              <p class="comments-empty">No comments yet.</p>
            </section>
          </aside>
        </section>
      </article>
    </template>

    <template id="projects-template">
      <article class="workspace-panel utility-panel projects-panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow panel-kind">Your workspace</p>
            <h2 class="panel-title">Projects</h2>
          </div>
          <div class="panel-actions">
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
            <button class="icon-button projects-archive-button" type="button" title="Open archive" aria-label="Open archive">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="5" x="2" y="3" rx="1"></rect>
                <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path>
                <path d="M10 12h4"></path>
              </svg>
            </button>
            <button class="icon-button projects-add-button" type="button" title="Add project folder" aria-label="Add project folder">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="M8 12h8"></path>
                <path d="M12 8v8"></path>
              </svg>
            </button>
          </div>
        </header>
        <section class="projects-content">
        </section>
      </article>
    </template>

    <template id="search-template">
      <article class="workspace-panel search-panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow panel-kind">Search</p>
            <h2 class="panel-title">Search</h2>
          </div>
          <div class="panel-actions">
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
            <button class="icon-button utility-close" type="button" title="Close column" aria-label="Close column">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m15 9-6 6"></path>
                <path d="m9 9 6 6"></path>
              </svg>
            </button>
          </div>
        </header>
        <label class="search-box">
          <span>Search</span>
          <input class="search-input" type="search" autocomplete="off">
        </label>
        <div class="search-code-filter" aria-label="Filter search by code section"></div>
        <section class="search-results"></section>
      </article>
    </template>

    <template id="saved-template">
      <article class="workspace-panel utility-panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow panel-kind">Your workspace</p>
            <h2 class="panel-title">Saved Inbox</h2>
          </div>
          <div class="panel-actions">
            <div class="reader-text-size-controls saved-text-size-controls" role="group" aria-label="Saved text size">
              <button class="reader-text-size-button saved-text-decrease" type="button" aria-label="Decrease Saved text size">A−</button>
              <button class="reader-text-size-button saved-text-increase" type="button" aria-label="Increase Saved text size">A+</button>
            </div>
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
            <button class="icon-button utility-close" type="button" title="Close column" aria-label="Close column">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m15 9-6 6"></path>
                <path d="m9 9 6 6"></path>
              </svg>
            </button>
          </div>
        </header>
        <section class="saved-content">
        </section>
      </article>
    </template>

    <template id="analysis-template">
      <article class="workspace-panel utility-panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow panel-kind">Workspace</p>
            <h2 class="panel-title">Research</h2>
          </div>
          <div class="panel-actions">
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
            <button class="icon-button utility-close" type="button" title="Close column" aria-label="Close column">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m15 9-6 6"></path>
                <path d="m9 9 6 6"></path>
              </svg>
            </button>
          </div>
        </header>
        <section class="analysis-content"></section>
      </article>
    </template>

    <template id="settings-template">
      <article class="workspace-panel utility-panel settings-panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow panel-kind">Settings</p>
            <h2 class="panel-title">Settings</h2>
          </div>
          <div class="panel-actions">
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
          </div>
        </header>
        <section class="settings-list settings-library-card" aria-label="Code library settings">
          <label class="settings-row">
            <span>Jurisdiction</span>
            <select class="settings-jurisdiction-select" aria-label="Jurisdiction">
              <option value="jurisdiction-1">New York City</option>
            </select>
          </label>
          <label class="settings-row">
            <span>Version</span>
            <select class="settings-version-select" aria-label="Version">
              <option value="CodeContent/authored/new-york-city/2022-construction-codes/bundle.json#1">2022 Construction Codes</option>
            </select>
          </label>
          <label class="settings-row">
            <span>Code Section</span>
            <select class="settings-code-section-select" aria-label="Code section"></select>
          </label>
          <label class="settings-row settings-toggle-row">
            <span>Comparison Mode</span>
            <input class="settings-comparison-toggle" type="checkbox" role="switch" aria-label="Comparison Mode">
          </label>
        </section>
        <section class="settings-card settings-plan-card">
          <p class="section-label">Plan</p>
          <p class="settings-card-copy account-plan-detail"></p>
          <p class="settings-billing-line">Billing: <strong class="account-plan-label">Free</strong></p>
          <div class="settings-plan-features">
            <div class="settings-feature-row">
              <span class="settings-feature-icon" aria-hidden="true">&#10003;</span>
              <p><strong>Free</strong><span>Read codes, search, recent history, 25 saved sections, and 10 notes.</span></p>
            </div>
            <div class="settings-feature-row">
              <span class="settings-feature-icon is-pro" aria-hidden="true">&#10003;</span>
              <p><strong>Pro</strong><span>Unlimited saved sections, notes, projects, tags, PDF export, continuity, and cross-device sync.</span></p>
            </div>
          </div>
          <button class="settings-primary-button account-checkout" type="button">Upgrade to Pro</button>
          <button class="settings-link-button account-plan-secondary" type="button">Restore Purchases</button>
        </section>
        <section class="settings-card account-connector">
          <p class="section-label">Account</p>
          <p class="settings-card-copy account-status-copy"></p>
          <div class="account-summary" hidden>
            <span>Signed in as</span>
            <strong class="account-display-name"></strong>
          </div>
          <div class="account-profile-editor" hidden>
            <label for="settings-public-username">Public username</label>
            <input id="settings-public-username" class="account-public-username" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="username">
            <p class="account-profile-helper">Used later for public and collaboration features. This stays separate from your Apple identity.</p>
            <button class="settings-secondary-button account-profile-save" type="button">Save Public Username</button>
          </div>
          <button class="settings-primary-button account-sign-in" type="button">Sign in</button>
          <button class="settings-secondary-button account-clear" type="button">Sign Out</button>
        </section>
        <section class="settings-card account-sync-card">
          <p class="section-label">Sync</p>
          <div class="account-sync-status">
            <span class="account-sync-icon" aria-hidden="true">&#8635;</span>
            <div>
              <strong class="account-sync-title">Not signed in</strong>
              <p class="connector-status">Sign in to sync saved work across iOS and web.</p>
            </div>
          </div>
          <div class="account-sync-conflicts"></div>
          <button class="settings-secondary-button account-sync-now" type="button">Sync Now</button>
        </section>
        <section class="reader-preview-card settings-card">
          <p class="section-label">Reader Preview</p>
          <p class="preview-code-title">Section BC 101: General</p>
          <h3>101.2 Scope.</h3>
          <p class="preview-copy">The provisions of this code shall apply to the construction, alteration, movement, addition, replacement, repair, equipment, use and occupancy of every building or structure.</p>
          <label class="preview-setting-row preview-font-family-row">
            <span>Font</span>
            <select class="preview-font-family-select" aria-label="Reader font">
              <option value="system">System</option>
              <option value="rounded">Rounded</option>
              <option value="serif">Serif</option>
              <option value="monospaced">Monospaced</option>
            </select>
          </label>
          <div class="preview-setting-row">
            <span>Font Size</span>
            <strong class="preview-font-value">10 pt</strong>
          </div>
          <input class="preview-slider preview-font-slider" type="range" min="10" max="26" value="10" aria-label="Preview font size">
          <div class="preview-setting-row">
            <span>Line Spacing</span>
            <strong class="preview-spacing-value">0</strong>
          </div>
          <input class="preview-slider preview-spacing-slider" type="range" min="0" max="4" value="0" aria-label="Preview line spacing">
        </section>
        <section class="settings-card settings-saved-data-card">
          <p class="section-label">Saved Data</p>
          <div class="settings-danger-list">
            <button class="settings-danger-button" type="button" data-clear-action="searches">
              <span aria-hidden="true">&#8981;</span>
              Clear Recent Searches
            </button>
            <button class="settings-danger-button" type="button" data-clear-action="bookmarks">
              <span aria-hidden="true">&#9734;</span>
              Clear All Bookmarks
            </button>
            <button class="settings-danger-button" type="button" data-clear-action="notes">
              <span aria-hidden="true">&#9998;</span>
              Clear All Notes
            </button>
            <button class="settings-danger-button" type="button" data-clear-action="tags">
              <span aria-hidden="true">&#9671;</span>
              Clear All Tags
            </button>
          </div>
        </section>
        <p class="settings-disclaimer">permitext is an unofficial reference tool. Verify legal, permitting, design, and construction decisions against enacted code text and agency guidance.</p>
        <p class="settings-status-message" role="status"></p>
      </article>
    </template>

    <script src="/web/app.js?v=20260720-no-scrollbars-v17" type="module"></script>
  </body>
</html>
