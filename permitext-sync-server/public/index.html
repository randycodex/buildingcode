<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121212">
    <title>permitext workspace</title>
    <link rel="manifest" href="/web/manifest.webmanifest?v=20260725-visual-inventory-v13">
    <link rel="apple-touch-icon" href="/web/icons/permitext-192.png">
    <link rel="stylesheet" href="/web/styles.css?v=20260726-web-reliability-v50">
    <link rel="stylesheet" href="/web/workboard-assets/workboard.css?v=20260722-workboard-zoom-v57">
  </head>
  <body>
    <main class="workspace-shell">
      <header class="topbar">
        <nav class="topbar-actions" aria-label="Workspace tools">
          <div class="topbar-action-group" aria-label="Read and find">
            <button class="toolbar-button" id="add-reader" type="button" aria-label="Add reader" title="Add reader">
              <span>Reader</span>
            </button>
            <button class="toolbar-button" id="toggle-search" type="button" aria-label="Search" title="Search" aria-pressed="false">Search</button>
          </div>
          <div class="topbar-action-group" aria-label="Your workspace">
            <button class="toolbar-button" id="toggle-saved" type="button" aria-label="Saved and projects" title="Saved and projects" aria-pressed="false">Saved</button>
          </div>
          <div class="topbar-action-group" aria-label="Research and preferences">
            <button class="toolbar-button" id="toggle-analysis" type="button" aria-label="AI-assisted research" title="AI-assisted research" aria-pressed="false">Research</button>
            <button class="toolbar-button" id="toggle-settings" type="button" aria-label="Settings" title="Settings" aria-pressed="false">Settings</button>
          </div>
          <div class="topbar-action-group" aria-label="Workspace layout">
            <button class="toolbar-button" id="fit-columns" type="button" aria-label="Reset columns" title="Reset columns">Reset</button>
            <button class="toolbar-button" id="collapse-readers" type="button" aria-label="One reader" title="One reader">One Reader</button>
          </div>
        </nav>
        <div class="topbar-account-state">
          <span class="connection-status" id="connection-status" role="status" aria-live="polite">Online</span>
          <div class="topbar-brand" aria-label="permitext">
            <span class="topbar-brand-name">permitext</span>
            <strong class="topbar-brand-plan" hidden></strong>
          </div>
        </div>
      </header>

      <section class="panel-track" id="panel-track" aria-label="permitext web workspace"></section>
    </main>

    <template id="reader-template">
      <article class="workspace-panel reader-panel">
        <header class="panel-header">
          <div>
            <label class="reader-code-picker">
              <span class="sr-only">Code section</span>
              <select class="code-select"></select>
            </label>
            <h2 class="panel-title">Reader</h2>
          </div>
          <div class="panel-actions">
            <button class="ghost-button reader-comments-toggle" type="button" aria-pressed="false">Comments</button>
            <div class="reader-typography-menu">
              <div class="reader-typography-tools" hidden>
                <div class="reader-text-size-controls" role="group" aria-label="Reader text size">
                  <button class="reader-text-size-button reader-text-decrease" type="button" aria-label="Decrease Reader text size">A−</button>
                  <button class="reader-text-size-button reader-text-increase" type="button" aria-label="Increase Reader text size">A+</button>
                </div>
                <div class="reader-spacing-controls" role="group" aria-label="Reader line spacing">
                  <button class="reader-spacing-button reader-spacing-decrease" type="button" aria-label="Decrease Reader line spacing">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg>
                  </button>
                  <button class="reader-spacing-button reader-spacing-increase" type="button" aria-label="Increase Reader line spacing">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                  </button>
                </div>
              </div>
              <button class="reader-typography-toggle" type="button" title="Show text and spacing controls" aria-label="Show text and spacing controls" aria-expanded="false">
                <svg class="reader-typography-expand-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                  <path d="m14 16-4-4 4-4"></path>
                </svg>
                <svg class="reader-typography-collapse-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                  <path d="m10 17 5-5-5-5"></path>
                </svg>
              </button>
            </div>
            <button class="icon-button reader-internal-search-toggle" type="button" title="Search in reader" aria-label="Search in reader" aria-pressed="false">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 6H3"></path>
                <path d="M10 12H3"></path>
                <path d="M10 18H3"></path>
                <circle cx="17" cy="15" r="3"></circle>
                <path d="m21 19-1.9-1.9"></path>
              </svg>
            </button>
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
            <button class="icon-button reader-close" type="button" title="Close reader" aria-label="Close reader">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m15 9-6 6"></path>
                <path d="m9 9 6 6"></path>
              </svg>
            </button>
          </div>
        </header>
        <div class="selector-stack">
          <label>
            Chapter
            <select class="chapter-select"></select>
          </label>
          <label class="section-picker" hidden>
            Section
            <select class="section-select"></select>
          </label>
        </div>
        <label class="reader-internal-search search-box" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.6-3.6"></path>
          </svg>
          <span>Search in reader</span>
          <input class="reader-internal-search-input search-input" type="search" autocomplete="off" placeholder="Search this reader">
          <button class="reader-internal-search-clear search-clear-button" type="button" aria-label="Clear reader search" hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="m9 9 6 6M15 9l-6 6" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round"></path>
            </svg>
          </button>
        </label>
        <section class="reader-body">
          <section class="reader-content"></section>
          <div class="reader-scroll-indicator" aria-hidden="true">
            <div class="reader-scroll-thumb"></div>
          </div>
          <div class="reader-comments-resizer" role="separator" aria-orientation="vertical" aria-label="Resize comments"></div>
          <aside class="reader-comments" hidden>
            <section class="comments-list">
              <p class="comments-empty">No comments yet.</p>
            </section>
          </aside>
        </section>
      </article>
    </template>

    <template id="projects-template">
      <article class="workspace-panel utility-panel projects-panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow panel-kind">Your workspace</p>
            <h2 class="panel-title">Projects</h2>
          </div>
          <div class="panel-actions">
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
            <button class="icon-button projects-archive-button" type="button" title="Open archive" aria-label="Open archive">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="5" x="2" y="3" rx="1"></rect>
                <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path>
                <path d="M10 12h4"></path>
              </svg>
            </button>
            <button class="icon-button projects-add-button" type="button" title="Add project folder" aria-label="Add project folder">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="M8 12h8"></path>
                <path d="M12 8v8"></path>
              </svg>
            </button>
          </div>
        </header>
        <section class="projects-content">
        </section>
      </article>
    </template>

    <template id="search-template">
      <article class="workspace-panel search-panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow panel-kind">Search</p>
            <h2 class="panel-title">Search</h2>
          </div>
          <div class="panel-actions">
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
            <button class="icon-button utility-close" type="button" title="Close column" aria-label="Close column">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m15 9-6 6"></path>
                <path d="m9 9 6 6"></path>
              </svg>
            </button>
          </div>
        </header>
        <section class="search-dock" aria-label="Search controls">
          <label class="search-box">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.6-3.6"></path>
            </svg>
            <span>Search</span>
            <input class="search-input" type="search" autocomplete="off" placeholder="Search">
            <button class="search-clear-button" type="button" aria-label="Clear search" hidden>
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="m9 9 6 6M15 9l-6 6" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </button>
          </label>
          <div class="search-result-summary" aria-live="polite" hidden>
            <span class="search-result-summary-copy"></span>
          </div>
          <div class="search-code-filter" aria-label="Filter search by code section" hidden></div>
        </section>
        <section class="search-results"></section>
      </article>
    </template>

    <template id="saved-template">
      <article class="workspace-panel utility-panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow panel-kind">Saved</p>
            <h2 class="panel-title">Saved</h2>
          </div>
          <div class="panel-actions">
            <button class="icon-button saved-sort-button" type="button" title="Sort saved sections" aria-label="Sort saved sections" aria-expanded="false">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 8 4-4 4 4"></path><path d="M7 4v16"></path><path d="m21 16-4 4-4-4"></path><path d="M17 20V4"></path>
              </svg>
            </button>
            <button class="icon-button saved-export-button" type="button" title="Export saved sections as PDF" aria-label="Export saved sections as PDF" aria-expanded="false">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12"></path><path d="m7 8 5-5 5 5"></path><path d="M5 13v7h14v-7"></path>
              </svg>
            </button>
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
            <button class="icon-button utility-close" type="button" title="Close column" aria-label="Close column">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m15 9-6 6"></path>
                <path d="m9 9 6 6"></path>
              </svg>

        </header>
        <section class="saved-projects-section" aria-label="Projects">
          <div class="saved-projects-heading">
            <p class="section-label">Projects</p>
            <div class="saved-projects-actions">
              <button class="saved-projects-archive-button" type="button" title="Open project archive" aria-label="Open project archive">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path><path d="M10 12h4"></path></svg>

              </button>
            </div>
          </div>
          <div class="saved-project-pages"></div>
          <div class="saved-project-page-dots" aria-hidden="true"></div>

        <section class="saved-inline-filters" hidden>

    <template id="settings-template">
      <article class="workspace-panel utility-panel settings-panel">
        <header class="panel-header">
          <div>
            <p class="eyebrow panel-kind">Settings</p>
            <h2 class="panel-title">Settings</h2>
          </div>
          <div class="panel-actions">
            <button class="icon-button pane-drag-handle" type="button" title="Drag column" aria-label="Drag column" draggable="true">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="9" cy="6" r="1.2"></circle>
                <circle cx="15" cy="6" r="1.2"></circle>
                <circle cx="9" cy="12" r="1.2"></circle>
                <circle cx="15" cy="12" r="1.2"></circle>
                <circle cx="9" cy="18" r="1.2"></circle>
                <circle cx="15" cy="18" r="1.2"></circle>
              </svg>
            </button>
          </div>
        </header>
        <section class="settings-card settings-list settings-library-card settings-preferences-card" aria-labelledby="settings-code-preferences-title">
          <h3 id="settings-code-preferences-title" class="section-label settings-section-title">Code Preferences</h3>
          <label class="settings-row">
            <span>Jurisdiction</span>
            <select class="settings-jurisdiction-select" aria-label="Jurisdiction">
              <option value="jurisdiction-1">New York City</option>
            </select>
          </label>
          <label class="settings-row">
            <span>Version</span>
            <select class="settings-version-select" aria-label="Version">
              <option value="CodeContent/authored/new-york-city/2026-zoning-resolution/bundle.json#1">NYC Zoning Resolution</option>
            </select>
          </label>
          <label class="settings-row">
            <span>Reader Font</span>
            <select class="preview-font-family-select" aria-label="Reader font">
              <option value="system">System</option>
              <option value="rounded">Rounded</option>
              <option value="serif">Serif</option>
              <option value="monospaced">Monospaced</option>
            </select>
          </label>
        </section>
        <section class="settings-card settings-plan-card" aria-labelledby="settings-plan-title">
          <h3 id="settings-plan-title" class="section-label settings-section-title">Plan</h3>
          <div class="settings-plan-features" aria-label="Plan comparison">
            <div class="settings-feature-row" data-plan-option="free">
              <span class="settings-feature-icon" aria-hidden="true"></span>
              <p><strong>Free</strong><span>Read codes, search, recent history, 25 saved sections, 10 notes, continuity, and cross-device sync.</span></p>
            </div>
            <div class="settings-feature-row" data-plan-option="pro">
              <span class="settings-feature-icon" aria-hidden="true"></span>
              <p><strong>Pro</strong><span>Unlimited saved sections and notes, Projects, Notebook, Report Draft, professional exports, tags, and web offline access. Optional Research add-on: selected-evidence Research, verified citations, immutable answer history, conversation history, and a monthly AI allowance.</span></p>
            </div>
          </div>
          <button class="settings-primary-button account-checkout" type="button">Upgrade to Pro</button>
          <button class="settings-secondary-button account-research-checkout" type="button">Add Research</button>
          <button class="settings-link-button account-plan-secondary" type="button">Restore Purchases</button>
        </section>
        <section class="settings-card account-connector" aria-labelledby="settings-account-title">
          <h3 id="settings-account-title" class="section-label settings-section-title">Account</h3>
          <p class="settings-card-copy account-status-copy"></p>
          <button class="settings-primary-button account-sign-in" type="button">Sign in</button>
          <button class="settings-secondary-button settings-destructive-secondary account-clear" type="button">Sign Out</button>
          <button class="settings-secondary-button settings-destructive-secondary account-delete" type="button">Delete Account</button>
        </section>
        <section class="settings-card settings-firm-card" aria-labelledby="settings-firm-title">
          <div class="settings-card-heading">
            <h3 id="settings-firm-title" class="section-label settings-section-title">Firm &amp; Collaboration</h3>
          </div>
          <p class="settings-card-copy">Share selected Projects with explicit Owner, Editor, Reviewer, or Viewer access. Personal files stay private until a Project is transferred.</p>
          <div class="settings-firm-content" aria-live="polite"></div>
        </section>
        <section class="settings-card settings-offline-card" aria-labelledby="settings-offline-title">
          <div class="settings-card-heading">
            <h3 id="settings-offline-title" class="section-label settings-section-title">Offline Access</h3>
          </div>
          <p class="settings-card-copy settings-offline-copy">Download the complete searchable 2022 Construction Codes and the Permitext app for use without internet.</p>
          <div class="settings-offline-status" role="status">Checking offline storage…</div>
          <progress class="settings-offline-progress" max="100" value="0" hidden></progress>
          <div class="connector-actions settings-offline-actions">
            <button class="settings-primary-button settings-offline-download" type="button">Download for Offline Use</button>
            <button class="settings-link-button settings-offline-remove" type="button" hidden>Remove Download</button>
          </div>
        </section>
        <section class="settings-card settings-data-card" aria-labelledby="settings-data-title">
          <h3 id="settings-data-title" class="section-label settings-section-title">Data &amp; Storage</h3>
          <div class="settings-data-subsection settings-projects-card">
            <div class="settings-projects-heading">
              <h4>Projects</h4>
              <button class="settings-link-button settings-project-select-all" type="button">Select All</button>
            </div>
            <p class="settings-projects-empty" hidden>No projects yet.</p>
            <div class="settings-project-list" aria-label="Projects"></div>
          </div>
          <div class="settings-danger-zone" role="group" aria-label="Data removal actions">
            <button class="settings-secondary-button settings-project-delete" type="button" disabled>Delete Selected</button>
            <div class="settings-danger-list">
            <button class="settings-danger-button" type="button" data-clear-action="searches">
              <span aria-hidden="true">&#8981;</span>
              Clear Recent Searches
            </button>
            <button class="settings-danger-button" type="button" data-clear-action="bookmarks">
              <span aria-hidden="true">&#9734;</span>
              Clear All Bookmarks
            </button>
            <button class="settings-danger-button" type="button" data-clear-action="notes">
              <span aria-hidden="true">&#9998;</span>
              Clear All Notes
            </button>
            <button class="settings-danger-button" type="button" data-clear-action="tags">
              <span aria-hidden="true">&#9671;</span>
              Clear All Tags
            </button>
            </div>
          </div>
