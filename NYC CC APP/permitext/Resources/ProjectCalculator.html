<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Occupant load</title>
  <style>
    :root { color-scheme: light dark; font: -apple-system-body; color: CanvasText; background: Canvas; }
    body { margin: 0; }
    main { max-width: 42rem; margin: auto; padding: 12px 16px 24px; }
    h1 { margin: 0 0 .5rem; font-size: 1.3rem; }
    h3 { margin: 0 0 .5rem; font-size: 1rem; }
    form, .occupant-load-body { display: grid; gap: 1rem; }
    form { margin: 0; }
    label { display: grid; gap: .35rem; }
    :where(input, select, textarea, button) {
      box-sizing: border-box; min-height: 44px; font: inherit; color: inherit;
      border: 0; border-radius: 12px; padding: .6rem .75rem;
      background: color-mix(in srgb, CanvasText 8%, Canvas);
    }
    select, textarea, input { min-width: 0; width: 100%; }
    textarea { resize: vertical; }
    input:disabled { opacity: .75; }
    button:disabled { opacity: .5; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
    a:focus-visible { outline: 2px solid AccentColor; outline-offset: 2px; }
    .source { margin: 0 0 1rem; text-align: left; }
    .calculation-draft-picker { display: flex; gap: .5rem; align-items: end; }
    .calculation-draft-picker label { flex: 1; min-width: 0; }
    .calculation-new-draft { min-width: 44px; }
    .calculation-table-notes { padding: .85rem; border-radius: 12px; background: color-mix(in srgb, CanvasText 6%, Canvas); }
    .calculation-table-notes-content { white-space: pre-line; overflow-wrap: anywhere; }
    .calculation-result { font-weight: 650; }
    .calculation-formula, .calculation-status, .calculation-draft-state, #saved-note { margin: 0; overflow-wrap: anywhere; }
    .calculation-draft-state { opacity: .72; }
    .calculation-actions button { width: 100%; }
    [hidden], :empty:is(.calculation-status, #saved-note) { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Occupant load</h1>
    <button type="button" class="source" id="governing-source">2022 Building Code · Table 1004.1.3</button>
    <div id="calculator"></div>
    <p id="saved-note" role="status"></p>
  </main>
</body>
</html>
